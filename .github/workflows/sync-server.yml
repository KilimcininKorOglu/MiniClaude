name: Sync Server

on:
  push:
    branches:
      - main
      - dev
      - kilimci-dev
    paths:
      - 'sync-server/**'
      - '.github/workflows/sync-server.yml'
  pull_request:
    paths:
      - 'sync-server/**'
      - '.github/workflows/sync-server.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: miniclaude
          POSTGRES_PASSWORD: miniclaude
          POSTGRES_DB: miniclaude_sync
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U miniclaude -d miniclaude_sync"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://miniclaude:miniclaude@localhost:5432/miniclaude_sync?sslmode=disable
      SYNC_SERVER_JWT_SECRET: ci-jwt-secret-with-at-least-32-bytes
      SYNC_SERVER_PROVIDER_SECRET_KEY: ci-provider-key-with-at-least-32-bytes
    defaults:
      run:
        working-directory: ./sync-server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.2'
          cache-dependency-path: sync-server/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build
        run: go build -o bin/sync-server ./cmd/server

      - name: Migration smoke
        run: make migrate-up && make migrate-down
