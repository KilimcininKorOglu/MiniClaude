<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.Title}} · MiniClaude Sync</title>
  <link rel="stylesheet" href="/web/static/app.css">
  <link rel="icon" href="data:,">
  <meta name="htmx-config" content='{"includeIndicatorStyles": false}'>
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
</head>
<body class="auth-page">
  <main class="auth-card">
    <p class="eyebrow">MiniClaude Sync</p>
    <h1>Log in</h1>
    <p class="muted">Manage workspace settings, providers, and connected clients.</p>
    {{if .Error}}<div class="alert">{{.Error}}</div>{{end}}
    <form method="post" action="/ui/login" class="stack" hx-boost="true">
      {{if .Next}}<input type="hidden" name="next" value="{{.Next}}">{{end}}
      <label>
        Email or username
        <input name="login" autocomplete="username" required>
      </label>
      <label>
        Password
        <input name="password" type="password" autocomplete="current-password" required>
      </label>
      <button type="submit">Log in</button>
    </form>
    <p class="muted">No account yet? <a href="/signup">Create one</a>.</p>
  </main>
</body>
</html>
